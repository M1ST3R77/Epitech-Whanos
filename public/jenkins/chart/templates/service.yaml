apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
spec:
  selector:
    app: {{ .Values.name }}
  {{ if .Values.deployment.ports }}
  ports:
    {{ range .Values.deployment.ports }}
    - protocol: TCP
      port: {{ . }}
      targetPort: {{ . }}
    {{ end }}
  {{ end }}
  type: NodePort
  