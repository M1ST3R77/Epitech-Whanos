version: '3'
services:
  jenkins:
    privileged: true
    build: .
    restart: unless-stopped
    ports:
      - 8080:8080
    environment:
      - PASSWORD=root
      - USER_ADMIN_PASSWORD=root
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
      - DOCKER_HOST=tcp://docker:2375
      - CASC_JENKINS_CONFIG=/var/jenkins_home/config.yml
    volumes:
      - ./../jenkins/config.yml:/var/jenkins_home/config.yml
      - ./../public/jenkins/job_dsl.groovy:/var/jenkins_home/job_dsl.groovy
      - ./../public/jenkins/:/var/jenkins_home/whanos/
    depends_on:
      - docker
  docker:
    image: docker:dind
    restart: unless-stopped
    privileged: true
    ports:
      - 2375:2375
    environment:
      - DOCKER_TLS_CERTDIR=