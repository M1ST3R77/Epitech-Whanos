- name: 'Install k3s for master'
  shell: |
    'curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="--node-name=master" sh -'

- name: 'Get the k3s token master'
  command: 'cat /var/lib/rancher/k3s/server/node-token'
  register: token

- name: 'Save the token and the IP'
  set_fact:
    k3s_token: "{{ token.stdout }}"
    k3s_master_ip: "{{ ansible_host }}"