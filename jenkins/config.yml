jenkins:
  authorizationStrategy:
    roleBased:
      roles:
        global:
          - name: Admin
            permissions:
              - Overall/Administer
            entries:
              - user: admin

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: ${USER_ADMIN_PASSWORD}
          name: Admin
