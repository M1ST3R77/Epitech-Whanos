jenkins:
  authorizationStrategy:
    roleBased:
      roles:
        global:
          - name: Admin
            permissions:
              - Overall/Administer
              - Overall/Read
            entries:
              - user: admin

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: admin
          password: ${USER_ADMIN_PASSWORD}
          name: Admin

jobs:
  - file: "/var/jenkins_home/job_dsl.groovy"
