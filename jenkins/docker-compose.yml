version: '3'
services:
  jenkins:
    privileged: true
    build: .
    ports:
      - 8080:8080
      - 50000:50000
    environment:
      - PASSWORD=root
      - USER_ADMIN_PASSWORD=root
      # - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
      - CASC_JENKINS_CONFIG=/var/jenkins_home/config.yml
    volumes:
      - ./config.yml:/var/jenkins_home/config.yml
      # - ./job_dsl.groovy:/var/jenkins_home/job_dsl.groovy
